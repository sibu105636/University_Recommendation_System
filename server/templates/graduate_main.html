<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>University Recommendation Application</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        /* Custom Styling */
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-size: 1.5rem;
        }
        .jumbotron {
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .footer {
            text-align: center;
            padding: 1rem;
            background: #343a40;
            color: white;
            margin-top: 20px;
        }
        .error {
            color: red;
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/main">University Recommendation</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/main">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/undergraduate">Undergraduate</a></li>
                <li class="nav-item"><a class="nav-link active" href="/graduate">Graduate</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="jumbotron">
        <h1 class="mb-3">Graduate Universities</h1>
        <p class="lead">Fill in the details.</p>

        <form id="recommendationForm" class="row g-3" action="/graduatealgo" method="GET">
            <div class="col-md-6">
                <label for="workEx" class="form-label">Years of Work Ex</label>
                <input type="number" id="workEx" name="workEx" class="form-control" placeholder="e.g., 5" required>
                <div class="error" id="errorworkEx"></div>
            </div>
            <div class="col-md-6">
                <label for="Desg" class="form-label">Designation</label>
                <input type="text" id="Desg" name="Desg" class="form-control" placeholder="e.g., Category 1" required>
                <div class="error" id="errorDesg"></div>
            </div>
            <div class="col-md-6">
                <label for="comTy" class="form-label">Company Type</label>
                <input type="text" id="comTy" name="comTy" class="form-control" placeholder="e.g., Category 1" required>
                <div class="error" id="errorcomTy"></div>
            </div>
            <div class="col-md-6">
                <label for="annScale" class="form-label">Annual Scale of Business Directly Impacted/ Handled</label>
                <input type="text" id="annScale" name="annScale" class="form-control" placeholder="e.g., Category 1" required>
                <div class="error" id="errorannScale"></div>
            </div>
            <div class="col-md-6">
                <label for="ngo" class="form-label">NGO</label>
                <input type="text" id="ngo" name="ngo" class="form-control" placeholder="e.g., Category 1" required>
                <div class="error" id="errorngo"></div>
            </div>
            <div class="col-md-6">
                <label for="gmat" class="form-label">GMAT Score</label>
                <input type="number" step="1" id="gmat" name="gmat" class="form-control" placeholder="e.g., 680" required>
                <div class="error" id="errorgmat"></div>
            </div>
            <div class="col-md-6">
                <label for="cgpa" class="form-label">CGPA</label>
                <input type="number" step="0.1" id="cgpa" name="cgpa" class="form-control" placeholder="e.g., 4.2" required>
                <div class="error" id="errorcgpa"></div>
            </div>
            <div class="col-md-6">
                <label for="ielts" class="form-label">IELTS</label>
                <input type="number" step="0.1" id="ielts" name="ielts" class="form-control" placeholder="e.g., 7" required>
                <div class="error" id="errorielts"></div>
            </div>
            <div class="col-md-6">
                <label for="colRnk" class="form-label">College/Institute Ranking</label>
                <input type="text" id="colRnk" name="colRnk" class="form-control" placeholder="e.g., Category 1" required>
                <div class="error" id="errorcolRnk"></div>
            </div>
            <div class="col-md-6">
                <label for="coRe" class="form-label">Course Relevance</label>
                <input type="text" id="coRe" name="coRe" class="form-control" placeholder="e.g., Category 1" required>
                <div class="error" id="errorcoRe"></div>
            </div>
            <div class="col-12 mt-3">
                <button type="submit" class="btn btn-primary w-100">Submit</button>
            </div>
        </form>
    </div>
</div>

<footer class="footer">
    <p>&copy; 2025 University Recommendation System. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById("recommendationForm").addEventListener("submit", function(event) {
        let valid = true;
        const fields = ["workEx", "Desg", "comTy", "annScale", "ngo", "gmat", "cgpa", "ielts", "colRnk", "coRe"];

        fields.forEach(field => {
            const input = document.getElementById(field);
            const errorDiv = document.getElementById(`error${field}`);
            errorDiv.textContent = "";

            if (!input.value.trim()) {
                errorDiv.textContent = "This field is required.";
                valid = false;
            }
        });

        if (!valid) {
            event.preventDefault();
        }
    });
</script>
</body>
</html>
