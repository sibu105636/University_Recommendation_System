<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>University Recommendation Application</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <style>
        /* Smooth gradient background */
        body {
            background: linear-gradient(to right, #e3f2fd, #ffffff);
            font-family: 'Poppins', sans-serif;
        }

        /* Navbar styling */
        .navbar {
            background-color: #007bff;
            padding: 1rem;
            border-radius: 0 0 10px 10px;
        }
        .navbar-brand {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }
        .navbar-brand:hover {
            color: #d9ebff;
        }

        /* Jumbotron (Hero Section) */
        .jumbotron {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .jumbotron h1 {
            font-weight: 600;
            color: #007bff;
        }
        .jumbotron p {
            font-size: 1.2rem;
            color: #555;
        }

        /* Forms */
        .form-control {
            border-radius: 8px;
            border: 1px solid #007bff;
            transition: all 0.3s ease-in-out;
        }
        .form-control:focus {
            border-color: #0056b3;
            box-shadow: 0 0 10px rgba(0, 91, 187, 0.3);
        }
        .form-select {
            border-radius: 8px;
            border: 1px solid #007bff;
        }

        /* Submit Button */
        .btn-primary {
            background: #007bff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #0056b3;
            box-shadow: 0px 5px 15px rgba(0, 91, 187, 0.4);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 1rem;
            background: #343a40;
            color: white;
            margin-top: 30px;
            border-radius: 10px 10px 0 0;
        }

        /* Error Messages */
        .error {
            color: red;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
    
<body>

    <nav class="navbar navbar-expand-lg" style="background-color: #ffffff;">
        <div class="container">
            <a class="navbar-brand" href="/main">
                <img src="https://studyark.in/wp-content/uploads/2025/01/StudyArk_Logo.png" alt="StudyArk Logo" height="100" width="auto">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-dark" href="/main">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-dark" href="/undergraduate">Undergraduate</a></li>
                    <li class="nav-item"><a class="nav-link active text-dark fw-bold" href="/graduate">Graduate</a></li>
                </ul>
            </div>
        </div>
    </nav>
<div class="container mt-4">
    <div class="jumbotron text-center p-5 bg-white shadow-lg rounded">
        <h1 class="mb-3 fw-bold text-gradient">
            🎓 Find Your Perfect MBA Program!
        </h1>
        <p class="lead text-muted">
            Enter your details and discover top universities tailored to your profile.
        </p>
        <div class="d-flex justify-content-center mt-4">
            <a href="#form-section" class="btn btn-lg btn-primary shadow-sm px-4 py-2 rounded-pill">
                <i class="fas fa-search"></i> Start Now
            </a>
        </div>


        <form id="recommendationForm" class="row g-3" action="/graduatealgo" method="GET">
            <div class="col-md-6">
                <label for="workEx" class="form-label fw-bold text-secondary">
                    <i class="bi bi-briefcase-fill"></i> Years of Work Experience
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white rounded-start">
                        <i class="bi bi-calendar-check"></i>
                    </span>
                    <input type="number" id="workEx" name="workEx" class="form-select border-primary shadow-sm rounded-end"
                        placeholder="e.g., 5" min="0" max="30" required>
                </div>
            </div>

            

            <div class="col-md-6">
                <label for="Desg" class="form-label fw-bold text-secondary">
                    <i class="bi bi-person-badge"></i> Designation
                </label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-primary text-white rounded-start">
                        <i class="bi bi-award-fill"></i>
                    </span>
                    <select id="Desg" name="Desg" class="form-select border-primary shadow-sm rounded-end" required>
                        <option value="" selected disabled>🔽 Select your designation</option>
                        <option value="Category 1">CXO</option>
                        <option value="Category 2">Head of Department (SVP/ VP/ Director)</option>
                        <option value="Category 3">Senior Management</option>
                        <option value="Category 4">Mid Management</option>
                        <option value="Category 5">Associate/ Analyst</option>
                    </select>
                </div>
            </div>
            
            
            

            <div class="col-md-6">
                <label for="comTy" class="form-label fw-bold text-secondary">
                    <i class="bi bi-building"></i> Company Type
                </label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-primary text-white rounded-start">
                        <i class="bi bi-briefcase-fill"></i>
                    </span>
                    <select id="comTy" name="comTy" class="form-select border-primary shadow-sm rounded-end" required>
                        <option value="" selected disabled>Select company type</option>
                        <option value="Category 1">FAANG, Nvidia, Tesla, MBB Consulting (McKinsey, BCG, Bain), Top Consulting firms</option>
                        <option value="Category 2">Tier-1 Tech, Big 4 Consulting (Deloitte, EY, PwC, KPMG), Top Investment Banks (Goldman Sachs, JP Morgan)</option>
                        <option value="Category 3">Unicorn Startups, Mid-Level MNCs, Fortune 500 Companies</option>
                        <option value="Category 4">Growth Stage Startups, Small Consulting Firms, Regional MNCs</option>
                        <option value="Category 5">Early Stage Startups, Local Businesses, Others</option>
                    </select>
                </div>
            </div>
            
            

            <div class="col-md-6">
                <label for="annScale" class="form-label fw-bold text-secondary">
                    <i class="bi bi-building"></i> Annual Scale of Business Impacted
                </label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-primary text-white rounded-start">
                        <i class="bi bi-cash-stack"></i>
                    </span>
                    <select id="annScale" name="annScale" class="form-select border-primary shadow-sm rounded-end" required>
                        <option value="" selected disabled>Select Annual Scale of Business Impacted</option>
                        <option value="Category 1">₹1000 Cr+ revenue OR 1000+ people team</option>
                        <option value="Category 2">₹500-1000 Cr revenue OR 500-999 people team</option>
                        <option value="Category 3">₹100-500 Cr revenue OR 100-499 people team</option>
                        <option value="Category 4">₹20-100 Cr revenue OR 20-99 people team</option>
                        <option value="Category 5">Less than ₹20 Cr revenue OR Less than 20 people team</option>
                    </select>
                </div>
            </div>
            
            
            
            
            

            <!-- <div class="col-md-6">
                <label for="annScale" class="form-label">Annual Scale of Business Impacted</label>
                <input type="text" id="annScale" name="annScale" class="form-control" placeholder="e.g., $10M" required>
            </div> -->

            <div class="col-md-6">
                <label for="ngo" class="form-label fw-bold text-secondary">
                    <i class="bi bi-briefcase-fill"></i> NGO Involvement
                </label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-primary text-white rounded-start">
                        <i class="bi bi-people-fill"></i>
                    </span>
                    <select id="ngo" name="ngo" class="form-select border-primary shadow-sm rounded-end" required>
                        <option value="" selected disabled>Select your level of involvement</option>
                        <option value="Category 1">Founded an NGO or led national-level initiatives with 100K+ beneficiaries</option>
                        <option value="Category 2">Led large-scale projects (state-level or 10K+ beneficiaries)</option>
                        <option value="Category 3">Managed regional projects or contributed significantly (1K+ beneficiaries)</option>
                        <option value="Category 4">Volunteer with substantial contributions (100+ beneficiaries)</option>
                        <option value="Category 5">Occasional volunteering or donations (less than 100 beneficiaries)</option>
                    </select>
                </div>
            </div>
            
            

            <div class="col-md-6">
                <label for="gmat" class="form-label fw-bold text-secondary">
                    <i class="bi bi-bar-chart-line"></i> GMAT Score
                </label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-primary text-white rounded-start">
                        <i class="bi bi-graph-up"></i>
                    </span>
                    <input type="number" id="gmat" name="gmat" 
                           class="form-select border-primary shadow-sm rounded-end"
                           placeholder="Enter GMAT score (200 - 800)" min="200" max="800" required>
                </div>
            </div>
            
            

            <div class="col-md-6">
                <label for="cgpa" class="form-label fw-bold text-secondary">
                    <i class="bi bi-award"></i> CGPA
                </label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-primary text-white rounded-start">
                        <i class="bi bi-mortarboard"></i>
                    </span>
                    <input type="number" id="cgpa" name="cgpa" 
                           class="form-select border-primary shadow-sm rounded-end"
                           placeholder="Enter CGPA (0 - 10)" step="0.1" min="0" max="10" required>
                </div>
            </div>
            
            

            <div class="col-md-6">
                <label for="ielts" class="form-label fw-bold text-secondary">
                    <i class="bi bi-translate"></i> IELTS Score
                </label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-primary text-white rounded-start">
                        <i class="bi bi-pencil-square"></i>
                    </span>
                    <input type="number" id="ielts" name="ielts" 
                           class="form-select border-primary shadow-sm rounded-end"
                           placeholder="Enter IELTS Score (0 - 9)" step="0.1" min="0" max="9" required>
                </div>
            </div>
            
            

            <div class="col-md-6">
                <label for="colRnk" class="form-label fw-bold text-secondary">
                    <i class="bi bi-mortarboard"></i> College/Institute Ranking
                </label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-primary text-white rounded-start">
                        <i class="bi bi-trophy"></i>
                    </span>
                    <select id="colRnk" name="colRnk" class="form-select border-primary shadow-sm rounded-end" required>
                        <option value="" selected disabled>Select ranking category</option>
                        <option value="Category 1">IITs, IIMs, AIIMS, NLSIU, ISB, IISc (Top-tier institutions)</option>
                        <option value="Category 2">Tier-1 NITs, XLRI, SPJIMR, JNU, IISER, TISS</option>
                        <option value="Category 3">Top Private Colleges (BITS, Ashoka, Shiv Nadar, VIT, SRCC, DU top colleges)</option>
                        <option value="Category 4">State Government Universities, Decent Private Universities</option>
                        <option value="Category 5">Local/Regional Colleges, other Private Institutions</option>
                    </select>
                </div>
            </div>
            
            

            <div class="col-md-6">
                <label for="coRe" class="form-label fw-bold text-secondary">
                    <i class="bi bi-book"></i> Course Relevance
                </label>
                <div class="input-group shadow-sm">
                    <span class="input-group-text bg-primary text-white rounded-start">
                        <i class="bi bi-check2-circle"></i>
                    </span>
                    <select id="coRe" name="coRe" class="form-select border-primary shadow-sm rounded-end" required>
                        <option value="" selected disabled>Select relevance level</option>
                        <option value="Category 1">STEM, Medicine, Law, Business Management, Finance, Economics</option>
                        <option value="Category 2">Liberal Arts, Social Sciences, Public Policy</option>
                        <option value="Category 3">Hospitality, Media & Communication, Design & Fine Arts</option>
                        <option value="Category 4">Education, Psychology, Sports Management</option>
                        <option value="Category 5">General Studies, Vocational Courses, Others</option>
                    </select>
                </div>
            </div>
            
            

            <div class="col-12 mt-3">
                <button type="submit" class="btn btn-primary w-100">Get Recommendations</button>
            </div>
        </form>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <p>&copy; 2025 StudyArk University Finder. All rights reserved.</p>
    <a href="#"><i class="fab fa-facebook"></i></a>
    <a href="#"><i class="fab fa-twitter"></i></a>
    <a href="#"><i class="fab fa-linkedin"></i></a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
