<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>University Recommendation Application</title>

    <!-- Bootstrap 5 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        /* Page Styling */
        body {
            padding-top: 20px;
            background-color: #f8f9fa;
        }

        .jumbotron {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        /* Result Box */
        .results {
            margin-top: 20px;
            padding: 1rem;
            border-radius: 10px;
            background: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            display: none;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 1rem;
            background: #343a40;
            color: white;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">University Recommendation System</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="/main">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/undergraduate">Undergraduate College</a></li>
                <li class="nav-item"><a class="nav-link" href="/graduate">Graduate College</a></li>
            </ul>
        </div>
    </nav>
</div>

<div class="container mt-4">
    <div class="jumbotron">
        <h3>Undergraduate Universities</h3>
        <h4>Please Enter your SAT Score and Maximum Tuition Fees</h4>
        
        <!-- Form -->
        <form id="recommendationForm">
            <div class="mb-3">
                <label for="sat" class="form-label">SAT Score:</label>
                <input type="number" class="form-control" id="sat" name="sat" required>
            </div>
            
            <div class="mb-3">
                <label for="tuition" class="form-label">Maximum Tuition Fees:</label>
                <input type="number" class="form-control" id="tuition" name="tuition" required>
            </div>

            <button type="submit" class="btn btn-primary">Get Recommendations</button>
        </form>
    </div>

    <!-- University Results (Dynamically Filled) -->
    <div class="results" id="results">
        <h4>Recommended Universities</h4>
        <ul id="universityList" class="list-group"></ul>
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <p>&copy; 2025 University Recommendation System. All rights reserved.</p>
</footer>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('recommendationForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent form submission

        // Get user input
        const sat = parseInt(document.getElementById('sat').value, 10);
        const tuition = parseInt(document.getElementById('tuition').value, 10);

        // Basic validation
        if (isNaN(sat) || sat < 400 || sat > 1600) {
            alert("Please enter a valid SAT score (400-1600).");
            return;
        }
        if (isNaN(tuition) || tuition < 1000) {
            alert("Please enter a reasonable tuition fee.");
            return;
        }

        // Simulated university recommendation logic (replace with actual API request)
        const universities = [
            { name: "Harvard University", score: 1500, fees: 50000 },
            { name: "MIT", score: 1480, fees: 48000 },
            { name: "Stanford University", score: 1450, fees: 47000 },
            { name: "UC Berkeley", score: 1400, fees: 42000 },
            { name: "UCLA", score: 1350, fees: 39000 }
        ];

        // Filter based on SAT & Tuition Fee
        const filteredUniversities = universities.filter(u => u.score <= sat && u.fees <= tuition);

        // Display results
        const resultsDiv = document.getElementById('results');
        const universityList = document.getElementById('universityList');
        universityList.innerHTML = ""; // Clear previous results

        if (filteredUniversities.length > 0) {
            filteredUniversities.forEach(u => {
                const li = document.createElement('li');
                li.className = "list-group-item";
                li.textContent = `${u.name} (SAT: ${u.score}, Fees: $${u.fees})`;
                universityList.appendChild(li);
            });
        } else {
            universityList.innerHTML = "<li class='list-group-item'>No universities found matching your criteria.</li>";
        }

        resultsDiv.style.display = 'block';
    });
</script>

</body>
</html>
