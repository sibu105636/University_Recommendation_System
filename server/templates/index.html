<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Recommendation</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
    <header class="bg-gray-800 p-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold">UniReco</h1>
        <nav>
            <a href="/" class="text-gray-300 hover:text-white mx-2">Home</a>
            <a href="/about" class="text-gray-300 hover:text-white mx-2">About</a>
            <a href="/contact" class="text-gray-300 hover:text-white mx-2">Contact</a>
        </nav>
    </header>
    
    <div class="container mx-auto p-8">
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg text-center">
            <img src="https://assets.weforum.org/article/image/_sNw0oZO6IQV_vLpSbxFnx44SN_obtJrNdbSk0_yFFk.JPG" 
                 alt="University Image" class="w-full rounded-lg mb-4" style="height: 400px; object-fit: cover;">
            <h2 class="text-3xl font-bold mb-2">Find Your Dream University</h2>
            <p class="text-gray-400 mb-6">Select your education level to get the best recommendations tailored for you.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <a href="/undergraduate" class="block bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-lg shadow-md text-center transition">Undergraduate University</a>
                <a href="/graduate" class="block bg-green-500 hover:bg-green-600 text-white font-semibold py-3 rounded-lg shadow-md text-center transition">Graduate University</a>
            </div>
        </div>
        <div class="mt-8">
            <h3 class="text-2xl font-semibold mb-4 text-center">Top Universities</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="relative">  <img src="https://cdn.britannica.com/25/121725-050-8BF363EC/Hoover-Tower-Stanford-University-California.jpg" 
                         alt="Stanford University" class="rounded-lg shadow-md w-full" style="height: 200px; object-fit: cover;">
                </div>
                <div class="relative">  <img src="https://www.theenglishhome.co.uk/_gatsby/file/e4190c31d46b272255c52a2b95259cdc/ben-seymour-nqBUTBsDQNM-unsplash.jpg" 
                         alt="Oxford University" class="rounded-lg shadow-md w-full" style="height: 200px; object-fit: cover;">
                </div>
                <div class="relative">  <img src="https://www.univariety.com/blog/wp-content/uploads/2015/10/Why-MIT-is-the-Best-Technical-University-in-The-World-scaled-1200x900.jpg" 
                         alt="MIT University" class="rounded-lg shadow-md w-full" style="height: 200px; object-fit: cover;">
                </div>
                <div class="relative">  <img src="https://cdn.getyourguide.com/img/location/5c10eb2e55553.jpeg/99.jpg" 
                         alt="Cambridge University" class="rounded-lg shadow-md w-full" style="height: 200px; object-fit: cover;">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
